# Static file caching + compression for hresume.pro
#
# Include inside the site's `server { ... }` block (root = .../api/public), BEFORE `location / { ... }`:
#     include /var/www/html/hresume/api/deploy/nginx/hresume-static.conf;
# Then: sudo nginx -t && sudo systemctl reload nginx

# ---- Compression -----------------------------------------------------------------
# Serve the .gz files written by `npm run build` (vite precompress plugin) when present,
# and compress other text responses (HTML pages, JSON, SVG) on the fly.
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml application/xml application/json application/ld+json
    application/javascript text/javascript application/manifest+json
    image/svg+xml image/x-icon font/ttf application/vnd.ms-fontobject;

# ---- Vite build (/build/assets/*): file names contain a content hash -> cache forever ----
location ^~ /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# manifest.json must always be fresh (it points to the current hashed files).
location = /build/manifest.json {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# ---- Self-hosted fonts --------------------------------------------------------------
location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log off;
    try_files $uri =404;
}

# ---- Images / icons (not hashed: 30 days, revalidated with ETag afterwards) -------------
# Covers /images/*, favicons, logos, og-image and uploaded files under /storage/*.
location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
    try_files $uri /index.php?$query_string;
}

# Other downloadable assets (PDF worker, media).
location ~* \.(?:mp4|webm|pdf|woff2?|ttf)$ {
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
    try_files $uri /index.php?$query_string;
}

location = /site.webmanifest {
    add_header Cache-Control "public, max-age=604800" always;
}
